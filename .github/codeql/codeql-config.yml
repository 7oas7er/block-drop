# Path scope for Block Drop SAST. Full query suite comes from the workflow
# (`security-extended`). Document triage in docs/codeql.md.
name: block-drop-codeql

paths:
  - block-drop
  - infra/lambda
  - .github/workflows

paths-ignore:
  - "**/*.md"
  - "**/package-lock.json"
  - "infra/terraform/**"
  - "tests/node_modules/**"
  - "infra/lambda/node_modules/**"
