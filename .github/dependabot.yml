# Supply-chain updates for CI Actions, Playwright, and the high-scores Lambda SDK.
# PRs target staging so they go through the same test / terraform-plan gates as other work.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    target-branch: staging
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /tests
    schedule:
      interval: weekly
      day: monday
    target-branch: staging
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - javascript
    groups:
      playwright:
        patterns:
          - "@playwright/*"
          - "playwright*"

  - package-ecosystem: npm
    directory: /infra/lambda
    schedule:
      interval: weekly
      day: monday
    target-branch: staging
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - javascript
    groups:
      aws-sdk:
        patterns:
          - "@aws-sdk/*"
