name: Deploy Block Drop

# staging → staging AWS env; main → production AWS env.
# Deploy roles trust only those branch refs via OIDC, so pull_request jobs cannot assume them.
on:
  push:
    branches:
      - staging
      - main
    paths:
      - "block-drop/**"
      - ".github/workflows/deploy-block-drop.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-block-drop-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish to S3
    if: github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - name: Check environment variables
        run: |
          if [ -z "${{ vars.AWS_DEPLOY_ROLE_ARN }}" ]; then
            echo "Set AWS_DEPLOY_ROLE_ARN on the GitHub Environment to the Terraform github_deploy_role_arn output."
            exit 1
          fi
          if [ -z "${{ vars.AWS_REGION }}" ]; then
            echo "Set AWS_REGION on the GitHub Environment to the Terraform deploy_region output."
            exit 1
          fi
          if [ -z "${{ vars.AWS_SITE_BUCKET }}" ]; then
            echo "Set AWS_SITE_BUCKET on the GitHub Environment to the Terraform bucket_name output."
            exit 1
          fi
          if [ -z "${{ vars.AWS_DISTRIBUTION_ID }}" ]; then
            echo "Set AWS_DISTRIBUTION_ID on the GitHub Environment to the Terraform distribution_id output."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: block-drop-${{ github.run_id }}

      - name: Sync the game to S3
        run: |
          set -euo pipefail
          # Short max-age so Cloudflare, which caches .js and .css at the edge,
          # picks up a publish without waiting on its default four-hour TTL.
          aws s3 sync block-drop "s3://${{ vars.AWS_SITE_BUCKET }}" \
            --delete \
            --exclude "README.md" \
            --exclude ".DS_Store" \
            --exclude "*/.DS_Store" \
            --cache-control "public, max-age=60, must-revalidate"

      - name: Invalidate CloudFront
        run: |
          set -euo pipefail
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.AWS_DISTRIBUTION_ID }}" \
            --paths "/*"
