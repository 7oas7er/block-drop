<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Block Drop</title>
  <script>
    try {
      if (localStorage.getItem("block-drop-theme") === "light") {
        document.documentElement.setAttribute("data-theme", "light");
      }
    } catch (error) {}
  </script>
  <link rel="stylesheet" href="css/styles.css?v=theme-1">
</head>
<body>
  <p class="score-corner"><span class="label">Score</span> <span id="score">0</span></p>
  <h1>Block Drop</h1>
  <div class="layout">
    <aside class="high-scores" aria-label="High scores">
      <p class="label">High scores</p>
      <ol id="high-score-list"></ol>
      <p id="high-score-status" class="high-score-status" role="status"></p>
    </aside>
    <div class="playfield">
      <div id="board-wrap">
        <canvas id="board" width="300" height="600"></canvas>
        <div id="overlay" class="overlay hidden">
          <p id="overlay-text"></p>
          <p id="overlay-score" class="overlay-score hidden"></p>
          <form id="high-score-form" class="high-score-form hidden">
            <p>New high score</p>
            <label for="player-name">Name</label>
            <input id="player-name" name="player-name" type="text" maxlength="3" autocomplete="off" spellcheck="false" autocapitalize="characters">
            <button type="submit">Save</button>
          </form>
        </div>
      </div>
      <div class="touch-pad">
        <div class="touch-move">
          <button type="button" id="move-left" aria-label="Move left">←</button>
          <button type="button" id="soft-drop" aria-label="Soft drop">↓</button>
          <button type="button" id="move-right" aria-label="Move right">→</button>
        </div>
        <div class="touch-actions">
          <button type="button" id="rotate" aria-label="Rotate clockwise">Rotate</button>
          <button type="button" id="hard-drop" aria-label="Hard drop">Drop</button>
        </div>
      </div>
    </div>
    <aside class="panel">
      <div class="next-block">
        <p class="label">Next</p>
        <canvas id="next" width="120" height="120"></canvas>
      </div>
      <p class="stat"><span class="label">Level</span> <span id="level">1</span></p>
      <p class="stat"><span class="label">Lines</span> <span id="lines">0</span></p>
      <div class="actions">
        <button id="pause" type="button">Pause</button>
        <button id="restart" type="button">Restart</button>
        <button id="mute" type="button" aria-pressed="false">Sound on</button>
        <button id="theme" type="button" aria-pressed="false">Light mode</button>
      </div>
      <ul class="keys">
        <li>Left/Right move</li>
        <li>Up rotate</li>
        <li>Down soft drop</li>
        <li>Space hard drop</li>
        <li>P pause</li>
        <li>R restart</li>
      </ul>
    </aside>
  </div>
  <footer class="site-footer">
    <a href="imprint.html">Imprint</a>
  </footer>
  <script src="js/theme.js?v=theme-1"></script>
  <script src="js/pieces.js?v=theme-1"></script>
  <script src="js/game.js?v=theme-1"></script>
  <script src="js/audio.js?v=theme-1"></script>
  <script src="js/highscores.js?v=theme-1"></script>
  <script src="js/main.js?v=theme-1"></script>
</body>
</html>
